version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: collab
      POSTGRES_USER: collab_user
      POSTGRES_PASSWORD: collab_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab_user -d collab"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./apps/server
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://collab_user:collab_pass@postgres:5432/collab
      JWT_SECRET: local_dev_secret_change_in_prod
      PORT: 4000
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
